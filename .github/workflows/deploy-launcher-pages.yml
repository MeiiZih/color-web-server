name: Deploy launcher to GitHub Pages

on:
  push:
    branches:
      - agent/relaunch-color-web
    paths:
      - launcher-site/**
      - .github/workflows/deploy-launcher-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload launcher
        uses: actions/upload-pages-artifact@v4
        with:
          path: launcher-site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
