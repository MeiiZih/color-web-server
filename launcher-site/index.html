<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8f6">
  <meta name="description" content="在 ColorLab 醒來以前，調一杯屬於今天的心情色。">
  <link rel="icon" href="./colorlab-mark.svg" type="image/svg+xml">
  <link rel="preload" href="./colorlab-mark.svg" as="image" type="image/svg+xml">
  <link rel="preconnect" href="https://color-web-server-jprj.onrender.com">
  <link rel="dns-prefetch" href="https://color-web-server-jprj.onrender.com">
  <title>ColorLab｜調一杯今日心情色</title>
  <link rel="stylesheet" href="/app/characters.css">
  <style>
    [hidden] { display: none !important; }
    .compact-progress { display: none; }
    @media (max-width: 860px) {
      .compact-progress { display: flex; align-items: center; gap: 12px; margin: 14px 22px 0; font-size: .72rem; color: #725561; }
      .compact-progress span { flex: 1; height: 5px; border-radius: 5px; background: #f5e5e8; overflow: hidden; }
      .compact-progress i { display: block; width: var(--wake-progress, 8%); height: 100%; background: #d57d95; transition: width .5s ease; }
    }
    :root {
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: #413b41;
      background: #fff8f6;
      --coral: #ef7180;
      --coral-soft: #facbd3;
      --sun: #f5ca66;
      --sky: #80c7e8;
      --leaf: #a8d584;
      --cream: #fff8f6;
      --paper: rgba(255, 255, 255, .88);
      --ink: #413b41;
      --muted: #7b7179;
      --line: rgba(111, 86, 99, .13);
      --grid: rgba(128, 199, 232, .11);
      --mix-a: #ef7180;
      --mix-b: #f5ca66;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; background: var(--cream); }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      overflow-x: hidden;
      background:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px),
        radial-gradient(circle at 10% 8%, rgba(250, 203, 211, .72) 0 11rem, transparent 11.2rem),
        radial-gradient(circle at 92% 92%, rgba(128, 199, 232, .28) 0 15rem, transparent 15.2rem),
        linear-gradient(150deg, #fffaf9 0%, #fff8f4 50%, #f5fbfd 100%);
      background-size: 52px 52px, 52px 52px, auto, auto, auto;
    }

    button { font: inherit; }

    .ambient-shape {
      position: fixed;
      z-index: 0;
      border-radius: 999px;
      pointer-events: none;
      filter: blur(.1px);
      opacity: .78;
      animation: ambient-drift 8s ease-in-out infinite alternate;
    }

    .ambient-shape.one { width: 118px; height: 36px; top: 7%; right: -28px; rotate: -16deg; background: var(--sun); }
    .ambient-shape.two { width: 78px; height: 78px; left: 3%; bottom: 9%; background: var(--leaf); animation-delay: -2.5s; }
    .ambient-shape.three { width: 46px; height: 46px; top: 30%; left: 7%; background: var(--sky); animation-delay: -5s; }

    .experience {
      position: relative;
      z-index: 1;
      width: min(1160px, 100%);
      min-height: calc(100dvh - 36px);
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .92);
      border-radius: 34px;
      background: rgba(255, 255, 255, .76);
      box-shadow: 0 28px 88px rgba(135, 98, 114, .17);
      backdrop-filter: blur(18px);
    }

    .topbar {
      min-height: 76px;
      padding: 14px clamp(20px, 3vw, 34px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(248, 190, 201, .68);
    }

    .brand { display: flex; align-items: center; gap: 12px; font-size: 1.12rem; font-weight: 900; letter-spacing: .015em; }

    .brand-mark {
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, .9);
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 8px 22px rgba(98, 70, 83, .13);
    }

    .brand-mark img { width: 100%; height: 100%; display: block; object-fit: cover; }

    .top-note {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #845761;
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .09em;
    }

    .top-note::before { content: ""; width: 24px; height: 3px; border-radius: 99px; background: var(--coral); }

    .layout {
      min-height: calc(100dvh - 112px);
      padding: clamp(26px, 5vw, 62px);
      display: grid;
      grid-template-columns: minmax(0, .88fr) minmax(390px, 1.12fr);
      align-items: center;
      gap: clamp(30px, 6vw, 78px);
    }

    .intro { max-width: 500px; }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--coral);
      font-size: .77rem;
      font-weight: 900;
      letter-spacing: .18em;
    }

    h1 {
      max-width: 10em;
      margin: 0;
      font-size: clamp(2.5rem, 5.5vw, 4.65rem);
      line-height: 1.12;
      letter-spacing: -.055em;
    }

    h1 em { color: var(--coral); font-style: normal; }

    .lead {
      max-width: 32rem;
      margin: 20px 0 26px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.85;
    }

    .prompt-card {
      padding: 18px 19px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255, 255, 255, .8);
      box-shadow: 0 12px 34px rgba(100, 77, 88, .08);
    }

    .prompt-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; }

    .prompt-label { color: #9a626d; font-size: .72rem; font-weight: 900; letter-spacing: .12em; }

    .prompt-refresh {
      min-height: 38px;
      padding: 8px 12px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 0;
      border-radius: 999px;
      color: #715f67;
      background: #f7eff1;
      cursor: pointer;
      font-size: .78rem;
      font-weight: 800;
      transition: transform .18s ease, background .18s ease;
    }

    .prompt-refresh:hover { transform: translateY(-2px); background: #f2e5e9; }
    .prompt-refresh:focus-visible, .swatch:focus-visible, .reset-mix:focus-visible, .mix-stage:focus-visible { outline: 3px solid rgba(239, 113, 128, .32); outline-offset: 3px; }

    .prompt-text { min-height: 3.2em; margin: 14px 0 2px; font-size: 1rem; font-weight: 750; line-height: 1.65; }
    .prompt-text.is-changing { animation: prompt-swap .34s ease; }

    .service-state {
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 11px;
      color: #796c74;
      font-size: .86rem;
      font-weight: 750;
    }

    .state-orbit {
      position: relative;
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
      border: 2px solid rgba(239, 113, 128, .2);
      border-top-color: var(--coral);
      border-radius: 50%;
      animation: spin 1.15s linear infinite;
    }

    .state-orbit::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--coral-soft); }
    .service-state.ready .state-orbit { border: 0; background: var(--leaf); animation: ready-pop .5s ease both; }
    .service-state.ready .state-orbit::after { inset: 6px; background: #fff; }

    .wake-progress { margin-top: 13px; }
    .wake-progress-copy { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 7px; color: #8b727c; font-size: .72rem; font-weight: 850; }
    .wake-progress-track { height: 10px; overflow: hidden; border: 1px solid rgba(239, 113, 128, .16); border-radius: 999px; background: rgba(255, 255, 255, .82); box-shadow: inset 0 2px 5px rgba(102, 77, 89, .08); }
    .wake-progress-fill { width: var(--wake-progress, 8%); height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--coral), var(--sun), var(--sky), var(--leaf)); transition: width .65s cubic-bezier(.22, 1, .36, 1); }
    .wake-progress + .prompt-card { margin-top: 18px; }

    .lab-panel {
      position: relative;
      padding: clamp(18px, 3vw, 28px);
      overflow: hidden;
      border: 1px solid rgba(112, 90, 101, .14);
      border-radius: 30px;
      background: rgba(255, 255, 255, .86);
      box-shadow: 0 24px 60px rgba(103, 78, 90, .12);
    }

    .lab-panel::after {
      content: "";
      position: absolute;
      width: 170px;
      height: 170px;
      right: -74px;
      bottom: -84px;
      border-radius: 50%;
      background: rgba(128, 199, 232, .16);
      pointer-events: none;
    }

    .lab-heading { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .lab-kicker { margin: 0 0 4px; color: #a36a74; font-size: .69rem; font-weight: 900; letter-spacing: .13em; }
    .lab-heading h2 { margin: 0; font-size: clamp(1.15rem, 2.3vw, 1.48rem); }

    .formula-dots { display: flex; gap: 6px; }
    .formula-dots span { width: 9px; height: 22px; border-radius: 99px; animation: formula-wave 1.8s ease-in-out infinite; }
    .formula-dots span:nth-child(1) { background: var(--coral); }
    .formula-dots span:nth-child(2) { background: var(--sun); animation-delay: -.3s; }
    .formula-dots span:nth-child(3) { background: var(--sky); animation-delay: -.6s; }
    .formula-dots span:nth-child(4) { background: var(--leaf); animation-delay: -.9s; }

    .mix-stage {
      position: relative;
      min-height: clamp(285px, 34vw, 390px);
      margin: 18px 0 17px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(128, 199, 232, .19);
      border-radius: 24px;
      background:
        linear-gradient(rgba(128, 199, 232, .11) 1px, transparent 1px),
        linear-gradient(90deg, rgba(128, 199, 232, .11) 1px, transparent 1px),
        linear-gradient(165deg, #fffdfc, #f8fcfd);
      background-size: 34px 34px, 34px 34px, auto;
      cursor: crosshair;
      isolation: isolate;
    }

    .mix-stage::before, .mix-stage::after {
      content: "";
      position: absolute;
      border: 1px dashed rgba(111, 86, 99, .15);
      border-radius: 50%;
      animation: spin 16s linear infinite;
    }

    .mix-stage::before { width: 270px; height: 270px; }
    .mix-stage::after { width: 208px; height: 208px; animation-direction: reverse; animation-duration: 12s; }

    .mix-orb {
      position: relative;
      z-index: 3;
      width: clamp(158px, 22vw, 215px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 11px solid rgba(255, 255, 255, .9);
      border-radius: 45% 55% 51% 49% / 53% 45% 55% 47%;
      background: linear-gradient(135deg, var(--mix-a), var(--mix-b));
      box-shadow: 0 22px 54px rgba(102, 72, 88, .18);
      animation: orb-float 4s ease-in-out infinite, orb-morph 8s ease-in-out infinite alternate;
      transition: background .55s ease, transform .35s ease;
    }

    .mix-orb::before {
      content: "";
      position: absolute;
      inset: 13%;
      border-radius: inherit;
      background: rgba(255, 255, 255, .2);
      backdrop-filter: blur(2px);
    }

    .mix-orb img {
      position: relative;
      z-index: 2;
      width: 46%;
      aspect-ratio: 1;
      border: 5px solid rgba(255, 255, 255, .88);
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 10px 25px rgba(83, 63, 73, .16);
    }

    .mix-orb.bloom { animation: orb-pop .5s ease, orb-morph 8s ease-in-out infinite alternate; }

    .float-chip {
      position: absolute;
      z-index: 2;
      padding: 7px 10px;
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 999px;
      color: rgba(65, 59, 65, .65);
      background: rgba(255, 255, 255, .72);
      box-shadow: 0 9px 24px rgba(95, 72, 84, .09);
      font-size: .69rem;
      font-weight: 850;
      animation: chip-float 3.8s ease-in-out infinite;
    }

    .float-chip.one { top: 12%; left: 9%; rotate: -6deg; }
    .float-chip.two { top: 17%; right: 8%; rotate: 7deg; animation-delay: -1.1s; }
    .float-chip.three { right: 11%; bottom: 12%; rotate: -4deg; animation-delay: -2.2s; }

    .spark {
      position: absolute;
      z-index: 5;
      width: var(--spark-size, 14px);
      height: var(--spark-size, 14px);
      margin: calc(var(--spark-size, 14px) / -2);
      border-radius: 50%;
      background: var(--spark-color, var(--coral));
      pointer-events: none;
      animation: spark-out .9s ease-out forwards;
    }

    .mix-copy { position: relative; z-index: 2; text-align: center; }
    .mix-name { margin: 0; font-size: 1.1rem; font-weight: 900; }
    .mix-message { min-height: 2.8em; margin: 6px auto 0; color: var(--muted); font-size: .8rem; line-height: 1.55; }

    .swatches {
      position: relative;
      z-index: 2;
      margin-top: 15px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
    }

    .swatch {
      min-width: 0;
      min-height: 58px;
      padding: 8px 5px;
      display: grid;
      place-items: center;
      gap: 5px;
      border: 1px solid var(--line);
      border-radius: 16px;
      color: #675b62;
      background: rgba(255, 255, 255, .8);
      cursor: pointer;
      font-size: .69rem;
      font-weight: 850;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .swatch:hover { transform: translateY(-3px); box-shadow: 0 9px 20px rgba(91, 69, 80, .08); }
    .swatch[aria-pressed="true"] { border-color: var(--swatch); box-shadow: 0 0 0 3px color-mix(in srgb, var(--swatch) 22%, transparent); }
    .swatch-dot { width: 22px; height: 22px; border: 4px solid #fff; border-radius: 50%; background: var(--swatch); box-shadow: 0 5px 13px color-mix(in srgb, var(--swatch) 35%, transparent); }

    .reset-mix {
      min-height: 38px;
      margin: 12px auto 0;
      padding: 8px 14px;
      display: block;
      border: 0;
      border-radius: 999px;
      color: #785f68;
      background: #f8eef1;
      cursor: pointer;
      font-size: .75rem;
      font-weight: 850;
    }

    .reset-mix[hidden] { display: none; }

    .ready-curtain {
      position: fixed;
      z-index: 20;
      inset: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      visibility: hidden;
      opacity: 0;
      background: rgba(255, 248, 246, .86);
      backdrop-filter: blur(16px);
      transition: opacity .48s ease, visibility .48s ease;
    }

    .ready-curtain.show { visibility: visible; opacity: 1; }

    .ready-card { text-align: center; transform: translateY(12px) scale(.97); transition: transform .55s cubic-bezier(.2, .9, .2, 1); }
    .ready-curtain.show .ready-card { transform: none; }
    .ready-mark { width: 94px; height: 94px; margin: 0 auto 18px; display: block; opacity: 0; transform: scale(.4); filter: drop-shadow(0 14px 24px rgba(99, 71, 84, .15)); }
    .ready-mark svg { width: 100%; height: 100%; display: block; }
    .ready-curtain.show .ready-mark { animation: ready-pop .6s ease both; }
    .ready-card p { margin: 0 0 8px; color: var(--coral); font-size: .75rem; font-weight: 900; letter-spacing: .14em; }
    .ready-card h2 { margin: 0; font-size: clamp(1.8rem, 6vw, 3rem); letter-spacing: -.035em; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes ambient-drift { to { transform: translate3d(14px, -10px, 0) rotate(5deg); } }
    @keyframes formula-wave { 50% { transform: scaleY(.55); opacity: .62; } }
    @keyframes orb-float { 50% { transform: translateY(-9px) rotate(1.5deg); } }
    @keyframes orb-morph { to { border-radius: 55% 45% 44% 56% / 43% 56% 44% 57%; } }
    @keyframes orb-pop { 40% { transform: scale(1.08) rotate(-2deg); } }
    @keyframes chip-float { 50% { transform: translateY(-7px); } }
    @keyframes spark-out { 0% { transform: scale(.2); opacity: 0; } 25% { opacity: .9; } 100% { transform: translate(var(--spark-x), var(--spark-y)) scale(1.8); opacity: 0; } }
    @keyframes prompt-swap { 0% { opacity: .2; transform: translateY(6px); } 100% { opacity: 1; transform: none; } }
    @keyframes ready-pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }

    @media (max-width: 860px) {
      body { padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
      .experience { min-height: calc(100dvh - 24px); border-radius: 28px; }
      .layout { min-height: auto; padding: 24px; grid-template-columns: 1fr; gap: 30px; }
      .lab-panel { grid-row: 1; }
      .intro { grid-row: 2; max-width: none; text-align: center; }
      h1 { max-width: 11em; margin-inline: auto; font-size: clamp(2.3rem, 11vw, 4rem); }
      .lead { margin-inline: auto; }
      .service-state { justify-content: center; }
      .prompt-card { text-align: left; }
      .mix-stage { min-height: min(58vh, 390px); }
    }

    @media (max-width: 520px) {
      .topbar { min-height: 68px; padding: 11px 16px; }
      .brand { font-size: 1rem; }
      .brand-mark { width: 40px; height: 40px; }
      .top-note { font-size: .63rem; letter-spacing: .06em; }
      .top-note::before { width: 15px; }
      .layout { padding: 17px 15px 30px; gap: 27px; }
      .lab-panel { padding: 15px; border-radius: 23px; }
      .mix-stage { min-height: 285px; margin-top: 14px; border-radius: 19px; }
      .mix-stage::before { width: 230px; height: 230px; }
      .mix-stage::after { width: 180px; height: 180px; }
      .mix-orb { width: 158px; border-width: 8px; }
      .float-chip { font-size: .61rem; }
      .float-chip.one { top: 9%; left: 5%; }
      .float-chip.two { top: 12%; right: 4%; }
      .float-chip.three { right: 5%; bottom: 9%; }
      .swatches { gap: 7px; }
      .swatch { min-height: 54px; border-radius: 14px; font-size: .62rem; }
      .swatch-dot { width: 20px; height: 20px; }
      .intro { padding-inline: 3px; }
      .eyebrow { font-size: .68rem; }
      .lead { font-size: .92rem; line-height: 1.75; }
      .prompt-head { align-items: flex-start; }
      .prompt-refresh { min-height: 36px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <span class="ambient-shape one" aria-hidden="true"></span>
  <span class="ambient-shape two" aria-hidden="true"></span>
  <span class="ambient-shape three" aria-hidden="true"></span>

  <main class="experience">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"><img src="./colorlab-mark.svg" alt=""></span>
        <span>ColorLab</span>
      </div>
      <span class="top-note">COLOR MOOD LAB</span>
    </header>
    <div class="compact-progress" aria-hidden="true">準備你的探索空間<span><i></i></span></div>

    <div class="layout">
      <section class="intro" aria-labelledby="pageTitle">
        <p class="eyebrow">A SMALL PAUSE FOR YOU</p>
        <h1 id="pageTitle">等候的時候，先替今天調一個<em>顏色</em></h1>
        <p class="lead">ColorLab 正在準備你的探索空間。這段小小的空檔，就留給自己：選兩種顏色，看看它們會變成什麼心情。</p>

        <div class="service-state" id="serviceState" role="status" aria-live="polite">
          <span class="state-orbit" aria-hidden="true"></span>
          <span id="statusText">正在準備 ColorLab 空間</span>
        </div>
        <div class="wake-progress" id="wakeProgress" role="progressbar" aria-label="ColorLab 準備進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="8">
          <div class="wake-progress-copy"><span>準備進度（估計）</span><span id="progressText">8%</span></div>
          <div class="wake-progress-track"><div class="wake-progress-fill"></div></div>
        </div>

        <div class="prompt-card">
          <button class="prompt-refresh" id="retryConnection" type="button" hidden>重新連線</button>
          <div class="prompt-head">
            <span class="prompt-label">色彩小提問</span>
            <button class="prompt-refresh" id="nextPrompt" type="button" aria-label="換一個色彩小提問">
              <span aria-hidden="true">↻</span>
              換一個靈感
            </button>
          </div>
          <p class="prompt-text" id="promptText">如果今天是一種顏色，你希望它帶給你什麼感受？</p>
        </div>
      </section>

      <section class="lab-panel" aria-labelledby="labTitle">
        <div class="lab-heading">
          <div>
            <p class="lab-kicker">TODAY'S COLOR FORMULA</p>
            <h2 id="labTitle">調一杯今日心情色</h2>
          </div>
          <div class="formula-dots" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        </div>

        <div class="mix-stage" id="mixStage" role="button" tabindex="0" aria-label="互動色彩畫布，點擊可以灑下色彩">
          <span class="report-character wake-character"><img id="wakeCharacter" src="/assets/characters/red.webp" width="160" height="225" alt="紅色報告角色"></span>
          <span class="float-chip one">感受</span>
          <span class="float-chip two">個性</span>
          <span class="float-chip three">此刻</span>
          <div class="mix-orb" id="mixOrb" aria-hidden="true">
            <img src="./colorlab-mark.svg" alt="">
          </div>
        </div>

        <div class="mix-copy" aria-live="polite">
          <p class="mix-name" id="mixName">今天想從哪一種顏色開始？</p>
          <p class="mix-message" id="mixMessage">點選下方兩種顏色，或在畫布上灑下幾滴色彩。</p>
        </div>

        <div class="swatches" role="group" aria-label="選擇兩種心情色">
          <button class="swatch" type="button" data-color="coral" aria-pressed="false" style="--swatch:#ef7180"><span class="swatch-dot"></span><span>珊瑚紅</span></button>
          <button class="swatch" type="button" data-color="sun" aria-pressed="false" style="--swatch:#f5ca66"><span class="swatch-dot"></span><span>暖陽黃</span></button>
          <button class="swatch" type="button" data-color="sky" aria-pressed="false" style="--swatch:#80c7e8"><span class="swatch-dot"></span><span>天空藍</span></button>
          <button class="swatch" type="button" data-color="leaf" aria-pressed="false" style="--swatch:#a8d584"><span class="swatch-dot"></span><span>嫩葉綠</span></button>
        </div>
        <button class="reset-mix" id="resetMix" type="button" hidden>重新調一杯</button>
        <button class="character-motion-toggle" id="characterMotion" type="button" aria-pressed="false">暫停角色動畫</button>
      </section>
    </div>
  </main>

  <div class="ready-curtain" id="readyCurtain" aria-hidden="true">
    <div class="ready-card">
      <div class="ready-mark" aria-hidden="true">
        <svg viewBox="0 0 240 240" focusable="false">
          <defs>
            <filter id="readyMarkShadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#725561" flood-opacity=".16" />
            </filter>
          </defs>
          <circle cx="120" cy="120" r="112" fill="#fffaf8" />
          <g filter="url(#readyMarkShadow)">
            <circle cx="83" cy="83" r="47" fill="#f36f83" />
            <circle cx="157" cy="83" r="47" fill="#ffd66b" />
            <circle cx="83" cy="157" r="47" fill="#79bfe3" />
            <circle cx="157" cy="157" r="47" fill="#a9d584" />
            <circle cx="120" cy="120" r="38" fill="#fff" />
          </g>
          <path d="M105 103a25 25 0 1 0 0 34" fill="none" stroke="#4d4248" stroke-width="11" stroke-linecap="round" />
          <path d="M130 101v38h23" fill="none" stroke="#4d4248" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <p>YOUR SPACE IS READY</p>
      <h2>帶著這份顏色，開始探索</h2>
    </div>
  </div>

  <script>
    (() => {
      const SERVER_ORIGIN = 'https://color-web-server-jprj.onrender.com';
      const params = new URLSearchParams(window.location.search);
      const requestedPath = params.get('next');
      const safePath = requestedPath && requestedPath.startsWith('/') && !requestedPath.startsWith('//') && !requestedPath.includes('\\')
        ? requestedPath
        : '/main/common.html';
      const destination = `${SERVER_ORIGIN}${safePath}`;
      const previewMode = params.get('preview') === '1';
      const embedded = params.get('embedded') === '1' && window.parent !== window;
      const retryConnection = document.getElementById('retryConnection');
      let attemptStarted = Date.now();

      const palette = {
        coral: { hex: '#ef7180', soft: '#facbd3', single: '珊瑚勇氣', message: '保留熱情，也溫柔地照顧自己的步調。' },
        sun: { hex: '#f5ca66', soft: '#fff0bd', single: '暖陽好奇', message: '讓一點好奇心，替今天打開新的窗。' },
        sky: { hex: '#80c7e8', soft: '#dceffa', single: '天空自在', message: '給思緒多一點空間，答案會慢慢浮現。' },
        leaf: { hex: '#a8d584', soft: '#e1f1d3', single: '嫩葉安定', message: '穩穩地呼吸，你已經走在自己的路上。' }
      };

      const mixes = {
        'coral+sun': ['晨光珊瑚', '你把行動力與樂觀放在一起，今天適合勇敢開始。'],
        'coral+sky': ['晚霞粉藍', '熱情與理性剛好平衡，適合說出真正的想法。'],
        'coral+leaf': ['玫瑰花園', '溫柔裡帶著力量，照顧別人時也別忘了自己。'],
        'sky+sun': ['晴空汽水', '輕盈、明亮又有想像力，讓好奇心帶你往前。'],
        'sun+leaf': ['初夏草地', '安定中帶著期待，適合完成一件小小的好事。'],
        'sky+leaf': ['湖畔薄荷', '清楚而平靜，慢一點也能看見更完整的方向。']
      };

      const prompts = [
        '如果今天是一種顏色，你希望它帶給你什麼感受？',
        '最近哪一個小瞬間，讓你覺得自己正在慢慢變好？',
        '如果能把一種心情留給明天，你會選擇哪一種？',
        '此刻的你，比較需要勇氣、平靜、溫暖，還是自由？',
        '今天有什麼事情，值得送自己一個小小的肯定？'
      ];

      const root = document.documentElement;
      document.getElementById('characterMotion').addEventListener('click', event => {
        const paused = root.dataset.characterMotion !== 'off';
        root.dataset.characterMotion = paused ? 'off' : 'on';
        event.currentTarget.setAttribute('aria-pressed', String(paused));
        event.currentTarget.textContent = paused ? '播放角色動畫' : '暫停角色動畫';
      });
      const mixStage = document.getElementById('mixStage');
      const mixOrb = document.getElementById('mixOrb');
      const mixName = document.getElementById('mixName');
      const mixMessage = document.getElementById('mixMessage');
      const swatches = [...document.querySelectorAll('.swatch')];
      const resetMix = document.getElementById('resetMix');
      const promptText = document.getElementById('promptText');
      const nextPrompt = document.getElementById('nextPrompt');
      const serviceState = document.getElementById('serviceState');
      const statusText = document.getElementById('statusText');
      const readyCurtain = document.getElementById('readyCurtain');
      const wakeProgress = document.getElementById('wakeProgress');
      const progressText = document.getElementById('progressText');

      let selected = [];
      let promptIndex = 0;
      let completed = false;
      let wakeTimer;
      let progressTimer;
      let progress = 8;
      const startedAt = Date.now();
      const minimumVisibleTime = 1800;

      const setProgress = value => {
        progress = Math.max(progress, Math.min(100, Math.round(value)));
        root.style.setProperty('--wake-progress', `${progress}%`);
        wakeProgress.setAttribute('aria-valuenow', String(progress));
        progressText.textContent = `${progress}%`;
      };

      const startProgress = () => {
        setProgress(12);
        progressTimer = window.setInterval(() => {
          if (completed || progress >= 92) return;
          setProgress(progress + Math.max(1, Math.ceil((92 - progress) * .08)));
        }, 650);
      };

      const warmDestination = async () => {
        if (embedded) return; // The independent frontend already has its own local assets.
        if (!safePath.startsWith('/main/common.html')) return;

        const warmAsset = path => fetch(`${SERVER_ORIGIN}${path}`, {
          cache: 'force-cache',
          mode: 'cors'
        }).catch(() => null);

        const warmFeed = async type => {
          try {
            const response = await fetch(`${SERVER_ORIGIN}/api/homepage?type=${type}`, {
              cache: 'no-store',
              mode: 'cors'
            });
            if (!response.ok) return;
            const items = await response.json();
            const firstImage = Array.isArray(items) && items[0] && items[0].imageUrl;
            if (firstImage) {
              const imageUrl = new URL(firstImage, SERVER_ORIGIN).href;
              await fetch(imageUrl, { cache: 'force-cache', mode: 'cors' }).catch(() => null);
            }
          } catch (_error) {
            // 預熱失敗不會阻擋進入網站，首頁仍有圖片備援。
          }
        };

        const warming = Promise.allSettled([
          warmAsset('/main/common.html'),
          warmAsset('/css/common.css'),
          warmAsset('/css/mobile.css'),
          warmAsset('/assets/images/logo.png'),
          warmFeed('news'),
          warmFeed('common')
        ]);

        await Promise.race([
          warming,
          new Promise(resolve => window.setTimeout(resolve, 900))
        ]);
      };

      const pairKey = colors => colors.slice().sort((a, b) => ['coral', 'sun', 'sky', 'leaf'].indexOf(a) - ['coral', 'sun', 'sky', 'leaf'].indexOf(b)).join('+');

      const burst = (x, y, color) => {
        for (let index = 0; index < 8; index += 1) {
          const spark = document.createElement('span');
          const angle = (Math.PI * 2 * index) / 8 + Math.random() * .35;
          const distance = 28 + Math.random() * 52;
          spark.className = 'spark';
          spark.style.left = `${x}px`;
          spark.style.top = `${y}px`;
          spark.style.setProperty('--spark-color', color);
          spark.style.setProperty('--spark-size', `${8 + Math.random() * 9}px`);
          spark.style.setProperty('--spark-x', `${Math.cos(angle) * distance}px`);
          spark.style.setProperty('--spark-y', `${Math.sin(angle) * distance}px`);
          mixStage.appendChild(spark);
          window.setTimeout(() => spark.remove(), 950);
        }
      };

      const animateOrb = () => {
        mixOrb.classList.remove('bloom');
        void mixOrb.offsetWidth;
        mixOrb.classList.add('bloom');
      };

      const renderMix = () => {
        swatches.forEach(button => button.setAttribute('aria-pressed', String(selected.includes(button.dataset.color))));
        resetMix.hidden = selected.length === 0;

        if (selected.length === 0) {
          root.style.setProperty('--mix-a', '#ef7180');
          root.style.setProperty('--mix-b', '#f5ca66');
          mixName.textContent = '今天想從哪一種顏色開始？';
          mixMessage.textContent = '點選下方兩種顏色，或在畫布上灑下幾滴色彩。';
          return;
        }

        const first = palette[selected[0]];
        const second = selected[1] ? palette[selected[1]] : first;
        root.style.setProperty('--mix-a', first.hex);
        root.style.setProperty('--mix-b', selected[1] ? second.hex : first.soft);

        if (selected.length === 1) {
          mixName.textContent = first.single;
          mixMessage.textContent = first.message;
        } else {
          const [name, message] = mixes[pairKey(selected)];
          mixName.textContent = name;
          mixMessage.textContent = message;
        }
        animateOrb();
      };

      swatches.forEach(button => {
        button.addEventListener('click', () => {
          const color = button.dataset.color;
          const [key, name] = {coral:['red','紅'],sun:['yellow','黃'],sky:['blue','藍'],leaf:['green','綠']}[color];
          const companion = document.getElementById('wakeCharacter');
          companion.src = `/assets/characters/${key}.webp`;
          companion.alt = `${name}色報告角色`;
          if (selected.includes(color)) {
            selected = selected.filter(item => item !== color);
          } else {
            if (selected.length === 2) selected.shift();
            selected.push(color);
          }
          const stageBox = mixStage.getBoundingClientRect();
          burst(stageBox.width / 2, stageBox.height / 2, palette[color].hex);
          renderMix();
        });
      });

      resetMix.addEventListener('click', () => {
        selected = [];
        renderMix();
        animateOrb();
      });

      const sprinkleStage = event => {
        const box = mixStage.getBoundingClientRect();
        const x = typeof event.clientX === 'number' && event.clientX ? event.clientX - box.left : box.width / 2;
        const y = typeof event.clientY === 'number' && event.clientY ? event.clientY - box.top : box.height / 2;
        const choices = selected.length ? selected : Object.keys(palette);
        const color = palette[choices[Math.floor(Math.random() * choices.length)]].hex;
        burst(x, y, color);
      };

      mixStage.addEventListener('click', event => {
        if (event.target.closest('.swatch')) return;
        sprinkleStage(event);
      });
      mixStage.addEventListener('keydown', event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          sprinkleStage({});
        }
      });

      nextPrompt.addEventListener('click', () => {
        promptIndex = (promptIndex + 1) % prompts.length;
        promptText.classList.remove('is-changing');
        void promptText.offsetWidth;
        promptText.textContent = prompts[promptIndex];
        promptText.classList.add('is-changing');
      });

      const markReady = () => {
        if (completed) return;
        completed = true;
        window.clearTimeout(wakeTimer);
        window.clearInterval(progressTimer);
        setProgress(100);
        statusText.textContent = 'ColorLab 空間準備好了';
        serviceState.classList.add('ready');

        const wait = Math.max(500, minimumVisibleTime - (Date.now() - startedAt));
        window.setTimeout(() => {
          readyCurtain.classList.add('show');
          readyCurtain.setAttribute('aria-hidden', 'false');
          window.setTimeout(() => {
            if (embedded) window.parent.postMessage({ type: 'colorlab:ready' }, location.origin);
            else window.location.replace(destination);
          }, 1150);
        }, wait);
      };

      const wakeServer = async () => {
        if (completed) return;
        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), 12000);

        try {
          const response = await fetch(`${SERVER_ORIGIN}/health?wake=${Date.now()}`, {
            cache: 'no-store',
            mode: 'cors',
            signal: controller.signal
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const body = await response.text();
          if (body.trim() !== 'OK') throw new Error('Health check failed');
          setProgress(78);
          await warmDestination();
          setProgress(94);
          markReady();
        } catch (_error) {
          if (!completed && Date.now() - attemptStarted < 120000 && navigator.onLine) wakeTimer = window.setTimeout(wakeServer, 2600);
          else if (!completed) {
            window.clearInterval(progressTimer);
            statusText.textContent = navigator.onLine ? '這次連線需要久一點，你可以重新連線；作答進度不會清除。' : '目前沒有網路，連線恢復後再試一次。';
            progressText.textContent = '等待連線';
            wakeProgress.removeAttribute('aria-valuenow');
            retryConnection.hidden = false;
          }
        } finally {
          window.clearTimeout(timeout);
        }
      };

      retryConnection.addEventListener('click', () => {
        retryConnection.hidden = true;
        attemptStarted = Date.now();
        progress = 8;
        statusText.textContent = '正在準備 ColorLab 空間';
        startProgress();
        wakeServer();
      });

      if (previewMode) {
        statusText.textContent = 'ColorLab 色彩空間預覽中';
        setProgress(68);
      } else {
        startProgress();
        wakeServer();
      }
    })();
  </script>
</body>
</html>
