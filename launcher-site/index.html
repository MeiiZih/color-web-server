<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100a24">
  <meta name="description" content="ColorMind Lab 啟動頁：顯示待機動畫並喚醒伺服器。">
  <title>正在啟動 ColorMind Lab</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      --ink: #f8f7ff;
      --muted: #c8c3dc;
      --panel: rgba(20, 13, 43, 0.72);
      --line: rgba(255, 255, 255, 0.13);
      --violet: #9f7aea;
      --pink: #f472b6;
      --cyan: #67e8f9;
      --green: #86efac;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 20%, rgba(103, 232, 249, 0.18), transparent 32rem),
        radial-gradient(circle at 82% 78%, rgba(244, 114, 182, 0.2), transparent 34rem),
        linear-gradient(145deg, #080511 0%, #130a2a 48%, #081725 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: -40%;
      pointer-events: none;
      opacity: 0.36;
      background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 42px 42px;
      transform: perspective(700px) rotateX(62deg) translateY(18%);
      mask-image: linear-gradient(to bottom, transparent 10%, #000 70%);
    }

    .shell {
      position: relative;
      z-index: 1;
      width: min(92vw, 580px);
      padding: clamp(28px, 6vw, 48px);
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: var(--panel);
      box-shadow: 0 30px 90px rgba(0, 0, 0, .42), inset 0 1px rgba(255, 255, 255, .07);
      backdrop-filter: blur(22px);
    }

    .brand {
      margin: 0 0 8px;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      letter-spacing: .02em;
    }

    .brand span {
      background: linear-gradient(100deg, var(--cyan), #fff 45%, var(--pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .eyebrow {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: .82rem;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .loader {
      position: relative;
      width: 142px;
      height: 142px;
      margin: 0 auto 28px;
      display: grid;
      place-items: center;
    }

    .loader::before, .loader::after, .ring {
      content: "";
      position: absolute;
      border-radius: 50%;
      border: 2px solid transparent;
    }

    .loader::before {
      inset: 0;
      border-top-color: var(--cyan);
      border-right-color: rgba(103, 232, 249, .25);
      animation: spin 2.1s linear infinite;
    }

    .loader::after {
      inset: 15px;
      border-bottom-color: var(--pink);
      border-left-color: rgba(244, 114, 182, .25);
      animation: spin-reverse 1.55s linear infinite;
    }

    .ring {
      inset: 31px;
      border-top-color: var(--violet);
      animation: spin 1.2s linear infinite;
    }

    .core {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff, var(--cyan) 28%, var(--violet) 66%, #391e73);
      box-shadow: 0 0 28px rgba(103, 232, 249, .68), 0 0 62px rgba(159, 122, 234, .4);
      animation: pulse 1.6s ease-in-out infinite;
    }

    .loader.ready .core {
      background: radial-gradient(circle at 35% 30%, #fff, var(--green) 35%, #16a34a 75%);
      box-shadow: 0 0 34px rgba(134, 239, 172, .8);
    }

    .status-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 1.05rem;
      font-weight: 700;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 16px var(--cyan);
      animation: blink 1.2s ease-in-out infinite;
    }

    .ready .dot { background: var(--green); box-shadow: 0 0 16px var(--green); }

    .detail {
      min-height: 2.8em;
      margin: 0;
      color: var(--muted);
      font-size: .92rem;
      line-height: 1.55;
    }

    .progress {
      height: 5px;
      margin: 22px 0 12px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(255, 255, 255, .09);
    }

    .progress-bar {
      width: 38%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--cyan), var(--violet), var(--pink));
      animation: travel 1.5s ease-in-out infinite;
    }

    .progress.ready .progress-bar {
      width: 100%;
      animation: none;
      background: var(--green);
      transition: width .35s ease;
    }

    .elapsed {
      margin: 0 0 20px;
      color: rgba(255, 255, 255, .58);
      font-size: .78rem;
      font-variant-numeric: tabular-nums;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .button {
      min-height: 42px;
      padding: 10px 17px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255, 255, 255, .06);
      text-decoration: none;
      font: inherit;
      font-size: .86rem;
      cursor: pointer;
      transition: transform .2s ease, background .2s ease;
    }

    .button:hover { transform: translateY(-2px); background: rgba(255, 255, 255, .12); }
    .button.primary { border-color: rgba(103, 232, 249, .38); }
    .button[hidden] { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes spin-reverse { to { transform: rotate(-360deg); } }
    @keyframes pulse { 50% { transform: scale(.86); opacity: .72; } }
    @keyframes blink { 50% { opacity: .35; } }
    @keyframes travel {
      0% { transform: translateX(-115%); }
      100% { transform: translateX(365%); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>
<body>
  <main class="shell" aria-live="polite">
    <h1 class="brand"><span>ColorMind Lab</span></h1>
    <p class="eyebrow">Server Wake-up</p>

    <div class="loader" id="loader" aria-hidden="true">
      <span class="ring"></span>
      <span class="core"></span>
    </div>

    <div class="status-row" id="statusRow">
      <span class="dot"></span>
      <span id="status">正在喚醒伺服器</span>
    </div>
    <p class="detail" id="detail">免費伺服器休眠後，重新啟動通常需要約 30–60 秒，請稍候。</p>

    <div class="progress" id="progress" aria-label="伺服器啟動進度">
      <div class="progress-bar"></div>
    </div>
    <p class="elapsed" id="elapsed">已等待 0 秒 · 第 1 次連線</p>

    <div class="actions">
      <button class="button primary" id="retry" type="button" hidden>立即重試</button>
      <a class="button" id="directLink" href="https://color-web-server-jprj.onrender.com/">直接開啟網站</a>
    </div>
  </main>

  <script>
    (() => {
      const SERVER_ORIGIN = 'https://color-web-server-jprj.onrender.com';
      const params = new URLSearchParams(window.location.search);
      const requestedPath = params.get('next');
      const safePath = requestedPath && requestedPath.startsWith('/') && !requestedPath.startsWith('//')
        ? requestedPath
        : '/';
      const destination = `${SERVER_ORIGIN}${safePath}`;

      const status = document.getElementById('status');
      const detail = document.getElementById('detail');
      const elapsed = document.getElementById('elapsed');
      const loader = document.getElementById('loader');
      const progress = document.getElementById('progress');
      const statusRow = document.getElementById('statusRow');
      const retry = document.getElementById('retry');
      const directLink = document.getElementById('directLink');

      const startedAt = Date.now();
      const minimumVisibleTime = 3500;
      let attempt = 0;
      let retryTimer;
      let completed = false;

      directLink.href = destination;

      const updateElapsed = () => {
        const seconds = Math.floor((Date.now() - startedAt) / 1000);
        elapsed.textContent = `已等待 ${seconds} 秒 · 第 ${Math.max(attempt, 1)} 次連線`;
      };

      const markReady = () => {
        completed = true;
        status.textContent = '伺服器已就緒';
        detail.textContent = '連線成功，正在為你開啟 ColorMind Lab…';
        loader.classList.add('ready');
        progress.classList.add('ready');
        statusRow.classList.add('ready');
        retry.hidden = true;
        const visibleTime = Date.now() - startedAt;
        const redirectDelay = Math.max(850, minimumVisibleTime - visibleTime);
        window.setTimeout(() => window.location.replace(destination), redirectDelay);
      };

      const wakeServer = async () => {
        window.clearTimeout(retryTimer);
        attempt += 1;
        retry.hidden = true;
        status.textContent = attempt === 1 ? '正在喚醒伺服器' : '正在重新連線';
        detail.textContent = '已送出啟動請求，伺服器準備完成後會自動進入網站。';
        updateElapsed();

        const controller = new AbortController();
        const timeout = window.setTimeout(() => controller.abort(), 15000);

        try {
          const response = await fetch(`${SERVER_ORIGIN}/health?wake=${Date.now()}`, {
            cache: 'no-store',
            mode: 'cors',
            signal: controller.signal
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const body = await response.text();
          if (!body.trim().toUpperCase().includes('OK')) throw new Error('Health check failed');
          markReady();
        } catch (_) {
          if (completed) return;
          status.textContent = '伺服器仍在啟動';
          detail.textContent = '這是免費主機喚醒時的正常情況，3 秒後會自動再試。';
          retry.hidden = false;
          retryTimer = window.setTimeout(wakeServer, 3000);
        } finally {
          window.clearTimeout(timeout);
        }
      };

      retry.addEventListener('click', wakeServer);
      window.setInterval(updateElapsed, 1000);
      wakeServer();
    })();
  </script>
</body>
</html>
