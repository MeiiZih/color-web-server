<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8bcc8">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
    <script src="/js/pwa.js" defer></script>
    <title>ColorLab - 測驗紀錄</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/history.css">
    <script src="../js/navbar.js"></script>
    <script src="../js/test-api.js"></script>
    <link rel="stylesheet" href="/css/mobile.css">
</head>
<body class="page-test-history">
    <nav class="nav-header">
        <div class="site-logo-title">
            <img src="/assets/images/logo.png" alt="Logo" class="site-logo">
            <a href="/index.html" class="site-title">ColorLab</a>
          </div>
        <div class="nav-links">
            <a href="/main/common.html" class="nav-link">首頁</a>
            <a href="/test/test.html" class="nav-link">測驗系統</a>
            <a href="/main/about.html" class="nav-link">關於我們</a>
            <a href="/main/login-user.html" class="nav-link" id="loginButton">登入</a>
            <div class="user-dropdown" id="userDropdown" style="display: none;">
              <a href="#" class="user-icon" id="userName"></a>
              <div class="dropdown-content">
                <a href="/main/user/profile.html">個人資料</a>
                <a href="#" id="logoutLink">登出</a>
              </div>
            </div>
          </div>
    </nav>

    <div class="main-container">
        <section class="history-shell">
            <header class="history-heading">
                <span class="page-kicker">YOUR COLOR JOURNEY</span>
                <div class="history-title-row">
                    <h1>測驗紀錄</h1>
                    <span class="history-count" id="historyCount">讀取中</span>
                </div>
                <p>回顧每一次色彩探索，快速查看結果或開啟完整分析。</p>
            </header>

            <div id="historyCardList" class="history-card-list" aria-live="polite">
                <div class="history-state">正在讀取紀錄...</div>
            </div>

            <div class="history-table">
                <table>
                    <thead>
                        <tr>
                            <th>序號</th>
                            <th>日期</th>
                            <th>測驗</th>
                            <th>結果</th>
                            <th>詳細</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <tr><td colspan="5" class="history-state">正在讀取紀錄...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <div class="back-section">
        <a href="/test/test.html" class="back-button"><span aria-hidden="true">←</span><span>返回測驗首頁</span></a>
      </div>

    <div class="login-modal" id="loginModal">
        <div class="login-container">
            <h2 class="login-title" id="modalTitle">登入</h2>
            <!-- 登入表單 -->
            <div id="loginForm">
                <input type="text" class="input-field" placeholder="帳號" id="username">
                <input type="password" class="input-field" placeholder="密碼" id="password">
                <button class="login-button" onclick="login()">登入</button>
                <div class="login-options">
                    <button class="option-button" onclick="guestLogin()">訪客登入</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        國立臺中科技大學－資訊管理系114學年專題
    </footer>

    <script>
        // ====== 頁面存取檢查（避免未登入直接進來）======
        function checkPageAccess() {
          const adminToken = sessionStorage.getItem('adminToken');
          const admin      = sessionStorage.getItem('admin');
          const isGuest    = sessionStorage.getItem('isGuest') === 'true';
          const guestId    = sessionStorage.getItem('guestId');
          const userToken  = sessionStorage.getItem('token');
          const user       = sessionStorage.getItem('user');
          const userEmail  = sessionStorage.getItem('userEmail');
          const userName   = sessionStorage.getItem('userName');
        
          // 管理員導回後台
          if (adminToken && admin) {
            window.location.href = '/main/admin/admin.html';
            return;
          }
          // 非登入與非訪客 → 導去登入
          if (!((userToken && user) || (userEmail && userName) || (isGuest && guestId))) {
            window.location.href = '/main/login-user.html';
            return;
          }
        }
        
        // ====== DOM Ready ======
        document.addEventListener('DOMContentLoaded', () => {
          checkPageAccess();
          if (typeof updateNavbar === 'function') updateNavbar();
        
          // 處理 URL ?action=logout
          const urlParams = new URLSearchParams(window.location.search);
          if (urlParams.get('action') === 'logout') {
            if (typeof logout === 'function') logout();
            window.location.replace(location.pathname); // 清除參數後刷新
            return;
          }
        
          const userEmail            = sessionStorage.getItem('userEmail');
          const isGuest              = sessionStorage.getItem('isGuest') === 'true';
          const guestNoticeAccepted  = sessionStorage.getItem('guestNoticeAccepted') === 'true';
        
          if (userEmail && !isGuest) {
            fetchHistoryRecords();
          } else if (isGuest && guestNoticeAccepted) {
            showGuestNoAccessMessage();
          } else {
            showLogin();
          }
        });
        
        // 每 30 秒刷新一次導覽列（同步登入狀態）
        setInterval(() => {
          if (typeof updateNavbar === 'function') updateNavbar();
        }, 30000);
        
        // ====== 登入 / 模態視窗 ======
        function showLogin() {
          document.getElementById('loginModal').style.display = 'flex';
        }
        
        window.onclick = function (event) {
          const modal = document.getElementById('loginModal');
          if (event.target === modal) modal.style.display = 'none';
        };
        
        async function login() {
          const username = document.getElementById('username').value.trim();
          const password = document.getElementById('password').value;
        
          if (!username || !password) {
            alert('請輸入帳號和密碼');
            return;
          }
        
          try {
            sessionStorage.clear();
            const res = await fetch('/api/user/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email: username, password })
            });
            if (!res.ok) throw new Error('登入失敗，請檢查您的憑證或稍後再試。');
        
            const data = await res.json();
            if (!data.token) throw new Error('登入失敗：未收到有效 Token。');
        
            sessionStorage.setItem('userEmail', username);
            const loggedInUser = data.user || { email: username, name: data.userName };
            sessionStorage.setItem('userName', loggedInUser.name || loggedInUser.nickname || username.split('@')[0]);
            sessionStorage.setItem('token', data.token);
            sessionStorage.setItem('userToken', data.token);
            sessionStorage.setItem('user', JSON.stringify(loggedInUser));
            sessionStorage.setItem('userId', loggedInUser.id || loggedInUser._id || '');
            sessionStorage.setItem('isGuest', 'false');
            window.ColorLabAuth?.persistUserSession({
              token: data.token,
              email: username,
              name: loggedInUser.name || loggedInUser.nickname || username.split('@')[0],
              user: loggedInUser
            });
        
            alert('登入成功！');
            document.getElementById('loginModal').style.display = 'none';
            location.reload();
          } catch (err) {
            console.error('登入錯誤:', err);
            alert(err.message);
          }
        }
        
        function showGuestNoAccessMessage() {
          const tbody = document.getElementById('historyTableBody');
          const cardList = document.getElementById('historyCardList');
          document.getElementById('historyCount').textContent = '訪客模式';
          cardList.innerHTML = `
            <div class="history-state history-state-card">
              <span class="history-state-icon" aria-hidden="true">◫</span>
              <strong>訪客紀錄尚未綁定帳號</strong>
              <p>建立帳號並登入，即可同步同一瀏覽器的訪客紀錄並集中管理。</p>
              <a class="history-state-action" href="/main/user/register.html">立即註冊帳號</a>
            </div>`;
          tbody.innerHTML = `
            <tr>
              <td colspan="5" class="history-state">訪客紀錄尚未綁定帳號，建立帳號後即可集中管理。</td>
            </tr>`;
        }
        
        // ====== 讀取測驗紀錄 ======
        async function fetchHistoryRecords() {
          const userEmail = sessionStorage.getItem('userEmail');
          const guestId   = sessionStorage.getItem('guestId');
          const token     = sessionStorage.getItem('token');
          const isGuest   = sessionStorage.getItem('isGuest') === 'true';
        
          if (!userEmail && !isGuest) {
            return; // 不合理狀態，直接返回
          }
        
          let query = '';
          if (isGuest && guestId) {
            query = `guestId=${encodeURIComponent(guestId)}`;
          } else if (userEmail) {
            query = `email=${encodeURIComponent(userEmail)}`;
          } else {
            return;
          }
        
          const url = `/api/test/records?${query}`;
        
          try {
            const headers = { 'Content-Type': 'application/json' };
            if (token) headers['Authorization'] = `Bearer ${token}`;
        
            const res = await fetch(url, { headers });
            if (!res.ok) {
              const t = await res.text().catch(() => '');
              throw new Error(`${res.status} ${t}`);
            }
        
            const payload = await res.json();
            const records = Array.isArray(payload) ? payload : (payload.records || payload.data || []);
            displayHistoryRecords(records);
          } catch (err) {
            console.error('獲取測驗記錄失敗：', err);
            const tbody = document.getElementById('historyTableBody');
            document.getElementById('historyCount').textContent = '讀取失敗';
            document.getElementById('historyCardList').innerHTML = `
              <div class="history-state history-state-card error">
                <span class="history-state-icon" aria-hidden="true">!</span>
                <strong>無法讀取測驗紀錄</strong>
                <p>請確認網路連線後重新整理頁面。</p>
              </div>`;
            tbody.innerHTML = `
              <tr>
                <td colspan="5" class="history-state error">載入測驗紀錄失敗。</td>
              </tr>`;
          }
        }
        
        // ====== 渲染表格：結果＝MBTI + 主色 chips；詳情＝連到結果頁 ======
        function displayHistoryRecords(records) {
          const tbody = document.getElementById('historyTableBody');
          const cardList = document.getElementById('historyCardList');
          const count = document.getElementById('historyCount');
          if (!Array.isArray(records) || records.length === 0) {
            count.textContent = '0 筆紀錄';
            cardList.innerHTML = `
              <div class="history-state history-state-card">
                <span class="history-state-icon" aria-hidden="true">✦</span>
                <strong>還沒有測驗紀錄</strong>
                <p>完成第一份測驗後，結果就會整理在這裡。</p>
                <a class="history-state-action" href="/test/select.html">開始第一次測驗</a>
              </div>`;
            tbody.innerHTML = `
              <tr>
                <td colspan="5" class="history-state">目前沒有測驗紀錄</td>
              </tr>`;
            return;
          }

          count.textContent = `${records.length} 筆紀錄`;

          cardList.innerHTML = records.map((rec, idx) => {
            const id = rec._id || rec.id || String(idx);
            const date = fmtDate(rec.timestamp || rec.createdAt || rec.date);
            const test = rec.testType || rec.testName || '色彩性格測驗';
            const mbti = (rec.mbtiResult || rec.result || '—').toString();
            const primary = normalizePrimary(rec?.colorResult?.primary);
            const chips = primary.length ? renderColorChips(primary) : '';
            const detailUrl = `/test/result.html?id=${encodeURIComponent(id)}`;

            return `
              <article class="history-card">
                <div class="history-card-topline">
                  <span class="history-index">#${String(idx + 1).padStart(2, '0')}</span>
                  <time>${date}</time>
                </div>
                <span class="history-label">測驗項目</span>
                <h2>${escapeHtml(test)}</h2>
                <div class="history-result">
                  <span class="history-label">測驗結果</span>
                  <div class="history-result-value"><strong>${escapeHtml(mbti)}</strong>${chips}</div>
                </div>
                <a class="history-detail-link" href="${detailUrl}"><span>查看完整分析</span><span aria-hidden="true">→</span></a>
              </article>`;
          }).join('');
        
          tbody.innerHTML = records.map((rec, idx) => {
            const id   = rec._id || rec.id || String(idx);
            const date = fmtDate(rec.timestamp || rec.createdAt || rec.date);
            const test = rec.testType || rec.testName || '—';
        
            // MBTI
            const mbti = (rec.mbtiResult || rec.result || '—').toString();
        
            // 主色（只取 primary）
            const primary = normalizePrimary(rec?.colorResult?.primary);
            const chips   = primary.length ? renderColorChips(primary) : '';
        
            // 結果欄：MBTI + 主色 chips
            const resultCell = `${escapeHtml(mbti)} ${chips}`;
        
            // 詳情連結（可到分享小卡/完整報告頁）
            const detailUrl = `/test/result.html?id=${encodeURIComponent(id)}`;
        
            return `
              <tr>
                <td>${String(idx + 1).padStart(2, '0')}</td>
                <td>${date}</td>
                <td>${escapeHtml(test)}</td>
                <td>${resultCell}</td>
                <td style="text-align:center">
                  <a class="link-btn" href="${detailUrl}" title="查看詳情">查看</a>
                </td>
              </tr>`;
          }).join('');
        }
        
        // ====== 小工具 ======
        function fmtDate(ts) {
          try {
            const d = new Date(ts);
            if (isNaN(d.getTime())) return '-';
            return d.toLocaleString('zh-TW', {
              year: 'numeric', month: '2-digit', day: '2-digit',
              hour: '2-digit',  minute: '2-digit'
            });
          } catch { return '-'; }
        }
        
        function normalizePrimary(primary) {
          if (!primary) return [];
          if (Array.isArray(primary)) return primary;
          if (typeof primary === 'string') {
            return primary.split('/').map(s => s.trim()).filter(Boolean);
          }
          return [];
        }
        
        function renderColorChips(list) {
          return `
            <span class="color-chip">
              ${list.map(k => {
                const zh  = colorKeyToZh(k);
                const cls = colorKeyToClass(k);
                return zh ? `<span class="dot ${cls}"></span><span class="color-label">${zh}</span>` : '';
              }).join('')}
            </span>`;
        }
        
        function colorKeyToZh(k) {
          if (!k) return null;
          if (/red/i.test(k)   || /紅/.test(k))   return '紅';
          if (/yellow/i.test(k)|| /黃/.test(k))   return '黃';
          if (/green/i.test(k) || /綠/.test(k))   return '綠';
          if (/blue/i.test(k)  || /藍/.test(k))   return '藍';
          return null;
        }
        
        function colorKeyToClass(k) {
          if (!k) return '';
          if (/red/i.test(k)   || /紅/.test(k))   return 'red';
          if (/yellow/i.test(k)|| /黃/.test(k))   return 'yellow';
          if (/green/i.test(k) || /綠/.test(k))   return 'green';
          if (/blue/i.test(k)  || /藍/.test(k))   return 'blue';
          return '';
        }
        
        function escapeHtml(s) {
          if (s == null) return '';
          return String(s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }
    </script>
        
</body>
</html>
