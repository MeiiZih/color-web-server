<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8bcc8">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
    <script src="/js/pwa.js" defer></script>
    <title>編輯問卷 - ColorMind Lab</title>
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="../../css/EditSurvey.css">
    <script src="../../js/navbar.js"></script>
    <link rel="stylesheet" href="/css/mobile.css">
</head>
<body>
    <nav class="nav-header">
        <div class="site-logo-title">
            <img src="../../assets/images/logo.png" alt="Logo" class="site-logo">
            <span class="site-title">ColorMind Lab</span>
        </div>
        <div class="nav-links"></div>
    </nav>
    
    <main class="main-content">
        <div class="header-section">
            <a href="/main/admin/survey.html" class="back-button" aria-label="返回">
                <img src="../../assets/icons/back-button.png" alt="返回" class="back-img">
                <span class="back-text">問卷管理</span>
              </a>
            <h1 class="page-title">編輯問卷</h1>
            <button class="add-question-btn" id="addQuestionBtn">
                + 新增題目
            </button>
        </div>
        
        <div class="form-section">
            <div class="image-section">
                <div class="image-upload" id="imageUpload">
                    <div class="image-placeholder">🎨</div>
                    <button class="image-upload-btn" onclick="document.getElementById('imageInput').click()">
                        <span style="font-size: 24px;">📷</span>
                        圖片
                    </button>
                </div>
                <input type="file" id="imageInput" accept="image/*" style="display: none;">
            </div>
            
            <div class="form-fields">
                <div class="form-group">
                    <label class="form-label">標題:</label>
                    <input type="text" class="form-input" id="surveyTitle" placeholder="請輸入問卷標題">
                </div>
                
                <div class="form-group">
                    <label class="form-label">說明:</label>
                    <textarea class="form-textarea" id="surveyDescription" placeholder="請輸入問卷說明"></textarea>
                </div>
                
                <div class="action-buttons">
                    <button class="btn btn-delete" id="deleteBtn">刪除</button>
                    <button class="btn btn-edit" id="editBtn">編輯</button>
                    <button class="btn btn-save" id="saveBtn" style="display: none;">儲存</button>
                </div>
            </div>
        </div>
        
        <div class="questions-section">
            <div class="questions-header">
                <h2 class="questions-title">題目列表</h2>
            </div>
            <div id="questionsList">
                <!-- 題目列表將在這裡動態渲染 -->
            </div>
        </div>
    </main>
    
    <script>
        let currentSurvey = null;
        let editingQuestionIndex = null;
      
        // ==== 基本守門 ====
        function requireAdminOrRedirect() {
          const token = sessionStorage.getItem('adminToken');
          if (!token) {
            // 依你的路徑調整
            window.location.href = '/main/login-user.html';
            return null;
          }
          return token;
        }
      
        // ==== 初始化 ====
        document.addEventListener('DOMContentLoaded', () => {
          const adminToken = requireAdminOrRedirect();
          if (!adminToken) return;
      
          // 綁定按鈕
          const addBtn   = document.getElementById('addQuestionBtn');
          const editBtn  = document.getElementById('editBtn');
          const saveBtn  = document.getElementById('saveBtn');
          const delBtn   = document.getElementById('deleteBtn');
      
          addBtn && (addBtn.onclick = addNewQuestion);
          editBtn && (editBtn.onclick = toggleEditMode);
          saveBtn && (saveBtn.onclick = saveSurvey);
          delBtn && (delBtn.onclick = deleteSurvey);
      
          // 載入問卷
          const qs = new URLSearchParams(location.search);
          const surveyId = qs.get('id');
          if (surveyId) loadSurvey(surveyId);
      
          // 綁 Cloudinary 上傳
          attachCloudinaryToSurvey();
        });
      
        // ==== API ====
        async function loadSurvey(surveyId) {
          try {
            const adminToken = sessionStorage.getItem('adminToken');
            const res = await fetch(`/api/test/surveys/${surveyId}`, {
              headers: { 'Authorization': `Bearer ${adminToken}` }
            });
            if (!res.ok) throw new Error(await res.text() || '無法載入問卷');
      
            const data = await res.json();
            currentSurvey = {
              _id: surveyId,
              testType: data.testType,
              totalQuestions: data.totalQuestions,
              questions: Array.isArray(data.questions) ? data.questions : [],
              description: data.description || `我們是國立台中科技大學資訊管理系的學生。此份問卷主要是想要探討MBTI與色彩學之間的聯繫。\n整份問卷總共有32道題目，大約會花費您6分鐘的時間。*註*請依照您的「第一直覺」作答，不需要思考太多!!!\n非常感謝您參與此次問卷的填寫。`,
              imgUrl: data.imgUrl || ''
            };
            updateUI();
          } catch (e) {
            console.error(e);
            alert('載入問卷失敗');
          }
        }
      
        async function persistSurvey(silent) {
          try {
            const adminToken = sessionStorage.getItem('adminToken');
            const payload = getSurveyPayload();
            let res;
            if (currentSurvey?._id) {
              res = await fetch(`/api/test/surveys/${currentSurvey._id}`, {
                method: 'PUT',
                headers: {
                  'Authorization': `Bearer ${adminToken}`,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
              });
            } else {
              res = await fetch('/api/test/surveys', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${adminToken}`,
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
              });
            }
            if (!res.ok) throw new Error(await res.text() || '自動儲存失敗');
      
            const result = await res.json();
            if (!currentSurvey._id) {
              currentSurvey._id = result.survey?._id || result._id || currentSurvey._id;
            }
            if (!silent) alert('已儲存');
          } catch (e) {
            console.error(e);
            if (!silent) alert('儲存失敗');
          }
        }
      
        async function saveSurvey() {
          await persistSurvey(false);
          // 回到唯讀模式
          setEditable(false);
        }
      
        async function deleteSurvey() {
          if (!currentSurvey?._id) return alert('無法刪除未儲存的問卷');
          if (!confirm('確定要刪除這個問卷嗎？此操作無法復原。')) return;
      
          try {
            const adminToken = sessionStorage.getItem('adminToken');
            const res = await fetch(`/api/test/surveys/${currentSurvey._id}`, {
              method: 'DELETE',
              headers: { 'Authorization': `Bearer ${adminToken}` }
            });
            if (!res.ok) throw new Error(await res.text() || '刪除失敗');
            alert('刪除成功');
            window.location.href = 'survey.html';
          } catch (e) {
            console.error(e);
            alert('刪除失敗');
          }
        }
      
        // ==== UI ====
        function updateUI() {
          if (!currentSurvey) return;
          document.getElementById('surveyTitle').value = currentSurvey.testType || '';
          document.getElementById('surveyDescription').value = currentSurvey.description || '';
      
          // 初始唯讀
          setEditable(false);
      
          renderImage();
          renderQuestions();
        }
      
        function setEditable(on) {
          const title = document.getElementById('surveyTitle');
          const desc  = document.getElementById('surveyDescription');
          const editBtn = document.getElementById('editBtn');
          const saveBtn = document.getElementById('saveBtn');
      
          title.readOnly = !on;
          desc.readOnly  = !on;
      
          title.classList.toggle('editing', on);
          desc.classList.toggle('editing', on);
      
          if (editBtn) editBtn.style.display = on ? 'none' : 'inline-block';
          if (saveBtn) saveBtn.style.display = on ? 'inline-block' : 'none';
        }
      
        function toggleEditMode() {
          const title = document.getElementById('surveyTitle');
          setEditable(title.readOnly); // 如果現在是唯讀，就開啟編輯；反之關閉
        }
      
        function renderImage() {
          const box = document.getElementById('imageUpload');
          const hasImg = !!currentSurvey?.imgUrl;
          const imgHtml = hasImg ? `<img src="${currentSurvey.imgUrl}" alt="問卷圖片" class="image-preview">`
                                 : `<div class="image-placeholder">🎨</div>`;
          // 保留「更換圖片」按鈕，確保可重複上傳
          box.innerHTML = `
            ${imgHtml}
            <button class="image-upload-btn" type="button" onclick="document.getElementById('imageInput').click()">
              <span style="font-size: 24px;">📷</span> 更換圖片
            </button>
          `;
        }
      
        function renderQuestions() {
          const wrap = document.getElementById('questionsList');
          const list = Array.isArray(currentSurvey?.questions) ? currentSurvey.questions : [];
          if (!list.length) {
            wrap.innerHTML = '<p style="text-align: center; color: #666; padding: 40px;">暫無題目</p>';
            return;
          }
      
          wrap.innerHTML = list.map((q, i) => {
            const isEditing = editingQuestionIndex === i;
            const disabled = isEditing ? '' : 'disabled';
            const options = (q.options || []).map((opt, j) => `
              <div class="option-edit-row">
                <input type="text" class="option-input${isEditing ? ' editing' : ''}"
                       value="${String(opt).replace(/"/g, '&quot;')}" ${disabled}
                       onchange="updateOption(${i}, ${j}, this.value)">
                ${isEditing ? `<button class='btn-small' onclick='removeOption(${i}, ${j})' type='button'>刪除</button>` : ''}
              </div>
            `).join('');
      
            return `
              <div class="question-item">
                <div class="question-header">
                  <span class="question-number">題目 ${q.questionNumber}</span>
                  <div class="question-actions">
                    ${isEditing
                      ? `<button class='btn-small btn-save-question' onclick='saveSingleQuestion(${i})' type='button'>儲存</button>
                         <button class='btn-small' onclick='cancelEditQuestion()' type='button'>取消</button>`
                      : `<button class='btn-small btn-edit-question' onclick='editQuestion(${i})'>編輯</button>`}
                    <button class="btn-small btn-delete-question" onclick="deleteQuestion(${i})">刪除</button>
                  </div>
                </div>
                <div class="question-content">
                  <textarea class="question-textarea${isEditing ? ' editing' : ''}" ${disabled}
                            onchange="updateQuestionText(${i}, this.value)">${q.question || ''}</textarea>
                  <div class="options-list-edit">
                    ${options}
                    ${isEditing ? `<button class='btn-small' onclick='addOption(${i})' type='button'>新增選項</button>` : ''}
                  </div>
                </div>
              </div>
            `;
          }).join('');
        }
      
        // ==== 題目編修 ====
        window.updateQuestionText = function(i, val) {
          currentSurvey.questions[i].question = val;
        }
        window.updateOption = function(i, j, val) {
          currentSurvey.questions[i].options[j] = val;
        }
        window.addOption = function(i) {
          if (!Array.isArray(currentSurvey.questions[i].options)) {
            currentSurvey.questions[i].options = [];
          }
          currentSurvey.questions[i].options.push('新選項');
          renderQuestions();
        }
        window.removeOption = function(i, j) {
          const opts = currentSurvey.questions[i].options || [];
          if (opts.length <= 1) return alert('至少要有一個選項');
          opts.splice(j, 1);
          renderQuestions();
        }
        window.saveSingleQuestion = async function(i) {
          editingQuestionIndex = null;
          // 重新編號保險
          currentSurvey.questions.forEach((q, idx) => q.questionNumber = idx + 1);
          renderQuestions();
          await persistSurvey(true);
        }
        window.cancelEditQuestion = function() {
          editingQuestionIndex = null;
          renderQuestions();
        }
        function editQuestion(i) {
          editingQuestionIndex = i;
          renderQuestions();
        }
        async function deleteQuestion(i) {
          if (!confirm('確定要刪除這個題目嗎？')) return;
          currentSurvey.questions.splice(i, 1);
          currentSurvey.questions.forEach((q, idx) => q.questionNumber = idx + 1);
          renderQuestions();
          await persistSurvey(true);
        }
        async function addNewQuestion() {
          const n = (currentSurvey.questions?.length || 0) + 1;
          const q = {
            questionNumber: n,
            question: `請輸入題目 ${n}`,
            options: ['選項 A', '選項 B', '選項 C', '選項 D']
          };
          if (!Array.isArray(currentSurvey.questions)) currentSurvey.questions = [];
          currentSurvey.questions.push(q);
          renderQuestions();
          await persistSurvey(true);
        }
      
        function getSurveyPayload() {
          return {
            testType: document.getElementById('surveyTitle').value.trim(),
            totalQuestions: (currentSurvey.questions || []).length,
            questions: currentSurvey.questions || [],
            description: document.getElementById('surveyDescription').value,
            imgUrl: currentSurvey.imgUrl || ''
          };
        }
      
        // ==== Cloudinary ====
        const CLOUD_NAME = 'dgsj2css3';
        const UPLOAD_PRESET = 'color-web-homepage';
        const CLOUD_FOLDER = 'homepage'; // 建議問卷用獨立資料夾
      
        function showProgressSurvey(pct) {
          let bar = document.getElementById('cloudinaryProgressBarSurvey');
          let wrap = document.getElementById('cloudinaryProgressWrapSurvey');
          if (!wrap) {
            wrap = document.createElement('div');
            wrap.id = 'cloudinaryProgressWrapSurvey';
            wrap.style.cssText = 'height:8px;background:#f1f3f5;border-radius:8px;overflow:hidden;margin-top:8px;';
            bar = document.createElement('span');
            bar.id = 'cloudinaryProgressBarSurvey';
            bar.style.cssText = 'display:block;height:100%;background:#74c0fc;width:0%';
            wrap.appendChild(bar);
            const fi = document.getElementById('imageInput');
            fi && fi.parentNode && fi.parentNode.appendChild(wrap);
          }
          bar.style.width = pct + '%';
          if (pct >= 100) setTimeout(() => wrap.remove(), 700);
        }
      
        async function uploadToCloudinarySurvey(file) {
          const fd = new FormData();
          fd.append('file', file);
          fd.append('upload_preset', UPLOAD_PRESET);
          fd.append('folder', CLOUD_FOLDER);
          const url = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;
      
          const xhr = new XMLHttpRequest();
          const p = new Promise((resolve, reject) => {
            xhr.upload.addEventListener('progress', e => {
              if (e.lengthComputable) showProgressSurvey(Math.round((e.loaded/e.total)*100));
            });
            xhr.onreadystatechange = () => {
              if (xhr.readyState === 4) {
                if (xhr.status>=200 && xhr.status<300) {
                  try { resolve(JSON.parse(xhr.responseText)); }
                  catch(e){ reject(e); }
                } else {
                  reject(new Error('Cloudinary 上傳失敗'));
                }
              }
            };
            xhr.open('POST', url);
            xhr.send(fd);
          });
          const data = await p;
          if (!data.secure_url) throw new Error(data.error?.message || '上傳失敗');
          return data.secure_url;
        }
      
        function attachCloudinaryToSurvey() {
          const fileInput = document.getElementById('imageInput');
          if (!fileInput) return;
          fileInput.addEventListener('change', async (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            try {
              const url = await uploadToCloudinarySurvey(file);
              if (!currentSurvey) currentSurvey = { questions: [] };
              currentSurvey.imgUrl = url;
              renderImage();
              await persistSurvey(true);
              alert('圖片上傳成功');
            } catch (err) {
              console.error(err);
              alert('圖片上傳失敗：' + err.message);
            } finally {
              e.target.value = '';
            }
          });
        }
    </script>
</body>
</html>
