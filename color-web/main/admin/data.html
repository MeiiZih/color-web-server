<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8bcc8">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
    <script src="/js/pwa.js" defer></script>
    <title>數據管理 - ColorMind Lab</title>
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="../../css/data.css">
    <script src="../../js/navbar.js"></script>
</head>
<body>
    <nav class="nav-header">
        <div class="site-logo-title">
            <img src="../../assets/images/logo.png" alt="Logo" class="site-logo">
            <span class="site-title">ColorMind Lab</span>
        </div>
        <div class="nav-links"></div>
    </nav>
    
    <main class="main-content">
        <a href="/main/admin/admin.html" class="back-button" aria-label="返回">
            <img src="../../assets/icons/back-button.png" alt="返回" class="back-img">
            <span class="back-text">後臺管理</span>
        </a>
        
        <div class="tab-btns">
            <button class="tab-btn active" id="testTab">測驗結果</button>
            <button class="tab-btn" id="feedbackTab">用戶反饋</button>
        </div>
    
        <div class="data-management-container">
            <div class="content-wrapper">
                <div class="sidebar">
                    <div class="filter-section">
                        <h4>測驗名稱</h4>
                        <select class="filter-dropdown" id="testTypeFilter">
                            <option value="">請選擇測驗名稱</option>
                        </select>
                    </div>
                    
                    <div class="filter-section">
                        <h4>MBTI類型</h4>
                        <select class="filter-dropdown" id="mbtiFilter">
                            <option value="">請選擇人格</option>
                            <option value="ALL">ALL</option>
                            <option value="INTJ">INTJ - 建築師</option>
                            <option value="INTP">INTP - 邏輯學家</option>
                            <option value="ENTJ">ENTJ - 指揮官</option>
                            <option value="ENTP">ENTP - 辯論家</option>
                            <option value="INFJ">INFJ - 提倡者</option>
                            <option value="INFP">INFP - 調停者</option>
                            <option value="ENFJ">ENFJ - 主人公</option>
                            <option value="ENFP">ENFP - 競選者</option>
                            <option value="ISTJ">ISTJ - 物流師</option>
                            <option value="ISFJ">ISFJ - 守衛者</option>
                            <option value="ESTJ">ESTJ - 總經理</option>
                            <option value="ESFJ">ESFJ - 執政官</option>
                            <option value="ISTP">ISTP - 鑑賞家</option>
                            <option value="ISFP">ISFP - 探險家</option>
                            <option value="ESTP">ESTP - 企業家</option>
                            <option value="ESFP">ESFP - 表演者</option>
                        </select>
                    </div>
                    
                    <button class="download-btn" onclick="downloadData()">下載</button>
                </div>
                
                <div class="main-content-area">
                    <div class="total-count">
                        總填寫人數: <span class="count-label" id="totalCount">-</span>
                    </div>
                    
                    <div id="listView">
                        <div class="table-container">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>序號</th>
                                        <th>帳號</th>
                                        <th>MBTI人格</th>
                                        <th>測驗時間</th>
                                        <th>測驗結果</th>
                                    </tr>
                                </thead>
                                <tbody id="dataTableBody">
                                    <tr><td colspan="5" class="loading">請選擇測驗名稱和MBTI類型來查看數據</td></tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="pagination" id="pagination"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <footer class="footer">
        國立臺中科技大學－資訊管理系114學年專題
    </footer>
    
    <script>
        let currentFilters = { testType: '', mbtiCategory: '' };
        let currentPage = 1;
        let totalPages = 1;
        let isLoading = false;

        document.addEventListener('DOMContentLoaded', function () {
            // 檢查管理員權限
            const adminEmail = sessionStorage.getItem('adminEmail');
            const adminName  = sessionStorage.getItem('adminName');
            const adminToken = sessionStorage.getItem('adminToken');
            if (!adminEmail || !adminName || !adminToken) {
                // 改成根路徑，避免子資料夾相對路徑錯位
                window.location.href = '/main/login-user.html';
                return;
            }

            if (typeof updateNavbar === 'function') updateNavbar();

            // 載入測驗類型 & 綁定事件
            loadTestTypes();
            setupEventListeners();

            // 初始化空狀態
            initializeEmptyState();
        });

        function setupEventListeners() {
            document.getElementById('testTypeFilter').addEventListener('change', function () {
                currentFilters.testType = this.value;
                currentPage = 1;
                checkAndLoadData();
            });

            document.getElementById('mbtiFilter').addEventListener('change', function () {
                currentFilters.mbtiCategory = this.value;
                currentPage = 1;
                checkAndLoadData();
            });
        }

        function checkAndLoadData() {
            if (currentFilters.testType && currentFilters.mbtiCategory) {
                loadTestRecords();
            } else {
                initializeEmptyState();
            }
        }

        function initializeEmptyState() {
            document.getElementById('totalCount').textContent = '-';
            const tbody = document.getElementById('dataTableBody');
            let message = '請選擇測驗名稱和MBTI類型來查看數據';
            if (currentFilters.testType && !currentFilters.mbtiCategory) message = '請選擇MBTI類型來查看數據';
            if (!currentFilters.testType && currentFilters.mbtiCategory) message = '請選擇測驗名稱來查看數據';
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">${message}</td></tr>`;
        }

        // 讀取「測驗名稱」清單
        async function loadTestTypes() {
            try {
                console.log('正在載入測驗類型...');
                const res = await fetch(`/api/admin/test-types`, {
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${sessionStorage.getItem('adminToken') || ''}`
                    }
                });
                console.log('API 響應狀態:', res.status);

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.message || `HTTP ${res.status}`);
                }

                const data = await res.json();
                console.log('收到的測驗類型資料:', data);

                const select = document.getElementById('testTypeFilter');
                select.innerHTML = '<option value="">請選擇測驗名稱</option>';
                const list = Array.isArray(data) ? data : (data.testTypes || []);
                list.forEach(type => {
                    const opt = document.createElement('option');
                    opt.value = type;
                    opt.textContent = type;
                    select.appendChild(opt);
                });
            } catch (error) {
                console.error('載入測驗類型失敗:', error);
                alert('載入測驗類型失敗: ' + error.message);
            }
        }

        // 依條件載入「測驗紀錄」
        async function loadTestRecords() {
            if (isLoading) return;
            isLoading = true;
            try {
                const params = new URLSearchParams({ page: currentPage, limit: 10 });
                if (currentFilters.testType) params.append('testType', currentFilters.testType);
                if (currentFilters.mbtiCategory && currentFilters.mbtiCategory !== 'ALL') {
                    params.append('mbtiResult', currentFilters.mbtiCategory);
                }

                console.log('正在載入測驗紀錄，篩選條件:', currentFilters, '頁碼:', currentPage);

                const response = await fetch(`/api/admin/test-records?${params.toString()}`, {
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${sessionStorage.getItem('adminToken') || ''}`
                    }
                });

                console.log('測驗紀錄 API 響應狀態:', response.status);

                if (!response.ok) {
                    const err = await response.json().catch(() => ({}));
                    throw new Error(err.message || `HTTP ${response.status}`);
                }

                const data = await response.json();
                console.log('收到的測驗紀錄資料:', data);
                updateDataTable(data);
            } catch (error) {
                console.error('載入測驗紀錄失敗:', error);
                alert('載入測驗紀錄失敗: ' + error.message);
            } finally {
                isLoading = false;
            }
        }

        function updateDataTable(data) {
            const tbody = document.getElementById('dataTableBody');
            totalPages = data.totalPages || 1;

            if (!data.records || data.records.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">無資料</td></tr>';
                document.getElementById('totalCount').textContent = '0';
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            document.getElementById('totalCount').textContent = data.total ?? data.records.length;

            tbody.innerHTML = data.records.map((record, idx) => `
                <tr>
                    <td>${((currentPage - 1) * 10 + idx + 1).toString().padStart(2, '0')}</td>
                    <td>${record.email || '-'}</td>
                    <td>${record.mbtiResult || '-'}</td>
                    <td>${formatTimestamp(record.timestamp)}</td>
                    <td>${formatColorResult(record.colorResult)}</td>
                </tr>
            `).join('');

            updatePagination();
        }

        function formatTimestamp(ts) {
            if (!ts) return '-';
            const d = new Date(ts);
            return d.toLocaleString('zh-TW', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
        }

        function formatColorResult(colorResult) {
            if (!colorResult) return '-';
            let primaryColors = [];

            if (typeof colorResult === 'string') {
                primaryColors = colorResult.includes('/') ? colorResult.split('/').map(s=>s.trim()) : [colorResult];
            } else if (Array.isArray(colorResult)) {
                primaryColors = colorResult;
            } else if (typeof colorResult === 'object' && colorResult !== null && colorResult.primary) {
                const p = colorResult.primary;
                primaryColors = Array.isArray(p) ? p : (p.includes('/') ? p.split('/').map(s=>s.trim()) : [p]);
            }

            if (primaryColors.length === 0) return '-';

            const getColorName = (c) => {
                if (typeof c === 'string') {
                    if (c.includes('紅') || c.toLowerCase().includes('red')) return '紅';
                    if (c.includes('黃') || c.toLowerCase().includes('yellow')) return '黃';
                    if (c.includes('綠') || c.toLowerCase().includes('green')) return '綠';
                    if (c.includes('藍') || c.toLowerCase().includes('blue')) return '藍';
                }
                return c || '未知';
            };
            const getColorClass = (c) => {
                if (typeof c === 'string') {
                    const s = c.toLowerCase();
                    if (s.includes('紅') || s.includes('red')) return 'red';
                    if (s.includes('黃') || s.includes('yellow')) return 'yellow';
                    if (s.includes('綠') || s.includes('green')) return 'green';
                    if (s.includes('藍') || s.includes('blue')) return 'blue';
                }
                return 'gray';
            };

            return primaryColors.map(c => `<span class="color-indicator color-${getColorClass(c)}"></span>${getColorName(c)}`).join(' ');
        }

        function updatePagination() {
            const container = document.getElementById('pagination');
            container.innerHTML = '';
            if (totalPages <= 1) return;

            const makeBtn = (text, page) => {
                const b = document.createElement('button');
                b.className = `page-btn ${page === currentPage ? 'active' : ''}`;
                b.textContent = text;
                b.onclick = () => { currentPage = page; loadTestRecords(); };
                return b;
            };

            let start = Math.max(1, currentPage - 3);
            let end   = Math.min(totalPages, currentPage + 3);
            if (start <= 3) end = Math.min(7, totalPages);
            if (end >= totalPages - 2) start = Math.max(1, totalPages - 6);

            if (start > 1) {
                container.appendChild(makeBtn('1', 1));
                if (start > 2) { const s = document.createElement('span'); s.textContent = '...'; s.style.padding='0 5px'; container.appendChild(s); }
            }
            for (let i = start; i <= end; i++) container.appendChild(makeBtn(i, i));
            if (end < totalPages) {
                if (end < totalPages - 1) { const s = document.createElement('span'); s.textContent = '...'; s.style.padding='0 5px'; container.appendChild(s); }
                container.appendChild(makeBtn(totalPages, totalPages));
            }
        }

        async function downloadData() {
            if (!currentFilters.testType || !currentFilters.mbtiCategory) {
                alert('請先選擇測驗名稱和MBTI類型');
                return;
            }
            try {
                const params = new URLSearchParams({ page: 1, limit: 1000 });
                if (currentFilters.testType) params.append('testType', currentFilters.testType);
                if (currentFilters.mbtiCategory && currentFilters.mbtiCategory !== 'ALL') {
                    params.append('mbtiResult', currentFilters.mbtiCategory);
                }

                const response = await fetch(`/api/admin/test-records?${params.toString()}`, {
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${sessionStorage.getItem('adminToken') || ''}`
                    }
                });
                if (!response.ok) throw new Error('無法獲取數據');

                const data = await response.json();
                const csvContent = generateCSV(data.records || []);
                downloadCSV(csvContent, `測驗結果_${currentFilters.testType}_${currentFilters.mbtiCategory}.csv`);
            } catch (error) {
                console.error('下載失敗:', error);
                alert('下載失敗: ' + error.message);
            }
        }

        function generateCSV(records) {
            const headers = ['序號', '帳號', 'MBTI人格', '測驗時間', '測驗結果'];
            let csv = headers.join(',') + '\n';
            const fmtCSVColor = (cr) => {
                if (!cr) return '-';
                let arr = [];
                if (typeof cr === 'string') arr = cr.includes('/') ? cr.split('/').map(s=>s.trim()) : [cr];
                else if (Array.isArray(cr)) arr = cr;
                else if (typeof cr === 'object' && cr !== null && cr.primary) {
                    const p = cr.primary; arr = Array.isArray(p) ? p : (p.includes('/') ? p.split('/').map(s=>s.trim()) : [p]);
                }
                if (arr.length === 0) return '-';
                const name = (c)=> (c.includes('紅')||c.toLowerCase().includes('red'))?'紅':(c.includes('黃')||c.toLowerCase().includes('yellow'))?'黃':(c.includes('綠')||c.toLowerCase().includes('green'))?'綠':(c.includes('藍')||c.toLowerCase().includes('blue'))?'藍':c;
                return arr.map(name).join('/');
            };
            records.forEach((r, i) => {
                const row = [i + 1, r.email || '-', r.mbtiResult || '-', formatTimestamp(r.timestamp), fmtCSVColor(r.colorResult)];
                csv += row.map(x => `"${x}"`).join(',') + '\n';
            });
            return csv;
        }

        function downloadCSV(content, filename) {
            const blob = new Blob(['\ufeff' + content], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.href = url; link.download = filename; link.style.display = 'none';
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        document.getElementById('testTab').onclick = function () { location.href = 'data.html'; };
        document.getElementById('feedbackTab').onclick = function () { location.href = 'feedback.html'; };
    </script>
</body>
</html>
