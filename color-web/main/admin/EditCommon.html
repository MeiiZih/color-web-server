<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8bcc8">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
    <script src="/js/pwa.js" defer></script>
    <title>ColorMind Lab - 首頁資訊管理</title>
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="../../css/EditCommon.css">
    <script src="../../js/navbar.js"></script>
    <script src="../../js/edit-common.js" defer></script>
</head>
<body>
    <nav class="nav-header">
        <div class="site-logo-title">
            <img src="../../assets/images/logo.png" alt="Logo" class="site-logo">
            <span class="site-title">ColorMind Lab</span>
        </div>
        <div class="nav-links"></div>
    </nav>
    <main class="main-content">
        <div class="tabs">
            <div style="display:flex;gap:2rem;">
                <button class="tab-btn active" data-type="news">最新資訊</button>
                <button class="tab-btn" data-type="common">一般資訊</button>
            </div>
            <button id="add-btn" class="add-btn" style="margin:0 0 0 auto;">＋ 新增資訊</button>
        </div>
        <div id="info-list-section">
            <!-- JS 動態渲染資訊卡片 -->
        </div>
        <div id="edit-modal" class="modal" style="display:none;">
            <div class="modal-content">
                <h3 id="modal-title">新增/編輯資訊</h3>
                <form id="info-form">
                    <input type="hidden" id="info-id">
                    <input type="hidden" id="info-type">
                    <div class="form-row">
                        <label for="title">標題：</label>
                        <input type="text" id="title" required>
                    </div>
                    <div class="form-row">
                        <label for="description">說明：</label>
                        <textarea id="description" rows="3" required></textarea>
                    </div>
                    <div class="form-row">
                        <label for="link">連結：</label>
                        <input type="text" id="link" required>
                    </div>
                    <div class="form-row">
                        <label for="image-input">封面海報：</label>
                        <input type="file" id="image-input" accept="image/*">
                        <img id="preview-image" src="" style="display:none;max-width:200px;margin-top:10px;">
                        <input type="hidden" id="imageUrl">
                    </div>
                    <div class="form-actions">
                        <button type="submit" id="save-btn" class="save-btn">儲存</button>
                        <button type="button" id="cancel-btn" class="cancel-btn">取消</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <footer class="footer">
        國立臺中科技大學－資訊管理系114學年專題
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const adminEmail = sessionStorage.getItem('adminEmail');
            const adminName = sessionStorage.getItem('adminName');
            if (!adminEmail || !adminName) {
                window.location.href = '../../main/login-user.html';
            }
            if (typeof updateNavbar === 'function') updateNavbar();
        });
        /** === Cloudinary 設定：用你的值 === */
        const CLOUD_NAME = 'dgsj2css3';
        const UPLOAD_PRESET = 'color-web-homepage';
        const CLOUD_FOLDER = 'homepage';

        /** === 小工具：找出頁面上最合理的元素（不破壞你原本的 ID/Name） === */
        function findFileInput() {
        return (
            document.querySelector('input[type="file"][name*="image" i]') ||
            document.querySelector('input[type="file"][id*="image" i]') ||
            document.querySelector('input[type="file"]')
        );
        }
        function findHiddenImageUrlInput() {
        return (
            document.querySelector('input[name="imageUrl"]') ||
            document.querySelector('#imageUrl') ||
            document.querySelector('input[type="hidden"][name*="image" i]')
        );
        }
        function findPreviewImg() {
        return (
            document.querySelector('#preview') ||
            document.querySelector('img[data-preview]') ||
            document.querySelector('.preview, .preview-img')
        );
        }
        function showProgress(pct) {
        let bar = document.getElementById('cloudinaryProgressBar');
        let wrap = document.getElementById('cloudinaryProgressWrap');
        if (!wrap) {
            wrap = document.createElement('div');
            wrap.id = 'cloudinaryProgressWrap';
            wrap.style.cssText = 'height:8px;background:#f1f3f5;border-radius:8px;overflow:hidden;margin-top:8px;';
            bar = document.createElement('span');
            bar.id = 'cloudinaryProgressBar';
            bar.style.cssText = 'display:block;height:100%;background:#74c0fc;width:0%';
            wrap.appendChild(bar);
            const fi = findFileInput();
            fi && fi.parentNode && fi.parentNode.appendChild(wrap);
        }
        bar.style.width = pct + '%';
        if (pct >= 100) setTimeout(() => wrap.remove(), 700);
        }

        /** === 上傳到 Cloudinary（Unsigned） === */
        async function uploadToCloudinary(file) {
        const fd = new FormData();
        fd.append('file', file);
        fd.append('upload_preset', UPLOAD_PRESET);
        fd.append('folder', CLOUD_FOLDER);

        const url = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;

        // 用 XHR 取得進度（不動你原本的 fetch）
        const xhr = new XMLHttpRequest();
        const p = new Promise((resolve, reject) => {
            xhr.upload.addEventListener('progress', e => {
            if (e.lengthComputable) showProgress(Math.round((e.loaded / e.total) * 100));
            });
            xhr.onreadystatechange = () => {
            if (xhr.readyState === 4) {
                if (xhr.status >= 200 && xhr.status < 300) {
                try { resolve(JSON.parse(xhr.responseText)); }
                catch (err) { reject(err); }
                } else {
                reject(new Error('Cloudinary 上傳失敗'));
                }
            }
            };
            xhr.open('POST', url);
            xhr.send(fd);
        });

        const data = await p;
        if (!data.secure_url) throw new Error(data.error?.message || '上傳失敗');
        return data.secure_url;
        }

        /** === 綁定事件：不干擾你既有的 submit/儲存流程 === */
        (function attachCloudinaryToCommon(){
        const fileInput = findFileInput();
        const hidden = findHiddenImageUrlInput();
        const preview = findPreviewImg();
        if (!fileInput || !hidden) return; // 頁面沒有上傳欄位就略過

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            try {
            const url = await uploadToCloudinary(file);
            hidden.value = url;              // 回填你的 imageUrl 欄位（後端照舊接收）
            if (preview) preview.src = url;  // 即時預覽（如果頁面有預覽圖）
            } catch (err) {
            console.error(err);
            alert('圖片上傳失敗：' + err.message);
            } finally {
            e.target.value = ''; // 重置檔案欄位，避免同檔案無法再次觸發 change
            }
        });
        })();
    </script>
</body>
</html>
