<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">

    <title>ColorLab - 首頁</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/all.css">
    <link rel="stylesheet" href="/css/mobile.css">
</head>
<body>
    <nav class="nav-header">
        <div class="site-logo-title">
            <img src="../assets/images/logo.png" alt="Logo" class="site-logo" style="height: 40px; vertical-align: middle; margin-right: 10px;">
            <a href="/index.html" class="site-title" style="text-decoration:none;">ColorLab</a>
          </div>
        <div class="nav-links">
            <a href="/main/common.html" class="nav-link active">首頁</a>
            <a href="/test/test.html" class="nav-link">測驗系統</a>
            <a href="/main/about.html" class="nav-link">關於我們</a>
            <a href="/main/login-user.html" class="nav-link" id="loginButton">登入</a>
            <div class="user-dropdown" id="userDropdown" style="display: none;">
                <a href="#" class="user-icon" id="userName"></a>
                <div class="dropdown-content">
                    <a href="/main/user/profile.html">個人資料</a>
                    <a href="#" id="logoutLink">登出</a>
                </div>
            </div>
        </div>
    </nav>

    <h1 class="ux-visually-hidden">ColorLab 色彩性格探索</h1>

    <section class="carousel-section">
        <div class="section-header">
            <h2>最新資訊</h2>
        </div>
        <div class="single-carousel-container">
            <div class="single-carousel" id="newsCarousel" aria-label="最新資訊，可左右滑動" tabindex="0">
                <div class="carousel-loading">載入中...</div>
            </div>
            <div class="carousel-indicators" id="carouselIndicators"></div>
            <p class="carousel-swipe-hint" aria-hidden="true"><span>↔</span> 左右滑動查看更多</p>
        </div>
        <a href="news/events.html" class="view-more-button">查看更多活動</a>
    </section>

    <section class="info-section">
        <h2 class="section-title">一般資訊</h2>
        <div class="info-carousel-container">
            <div class="info-carousel" id="infoCarousel" aria-label="一般資訊，可左右滑動" tabindex="0">
                <div class="carousel-loading">載入中...</div>
            </div>
            <div class="carousel-indicators info-indicators" id="infoIndicators"></div>
            <p class="carousel-swipe-hint" aria-hidden="true"><span>↔</span> 左右滑動查看更多</p>
        </div>
        <a href="news/all.html" class="view-more-button">查看更多資訊</a>
    </section>

    <footer class="footer">
        國立臺中科技大學－資訊管理系114學年專題
    </footer>

    <script src="../js/navbar.js"></script>
    <script>
        // 首頁資訊資料
        let newsData = [];
        let commonData = [];

        function initializeSwipeCarousel(carousel, itemSelector, indicatorContainer) {
            const items = Array.from(carousel.querySelectorAll(itemSelector));
            if (!items.length) return;

            indicatorContainer.innerHTML = items.map((_, index) => `
                <button type="button" class="indicator ${index === 0 ? 'active' : ''}"
                    aria-label="查看第 ${index + 1} 則資訊" aria-pressed="${index === 0 ? 'true' : 'false'}"
                    data-carousel-index="${index}"></button>
            `).join('');

            const indicators = Array.from(indicatorContainer.querySelectorAll('.indicator'));
            const updateIndicator = () => {
                const carouselStart = carousel.getBoundingClientRect().left;
                let activeIndex = 0;
                let closestDistance = Infinity;

                items.forEach((item, index) => {
                    const distance = Math.abs(item.getBoundingClientRect().left - carouselStart);
                    if (distance < closestDistance) {
                        closestDistance = distance;
                        activeIndex = index;
                    }
                });

                indicators.forEach((indicator, index) => {
                    const active = index === activeIndex;
                    indicator.classList.toggle('active', active);
                    indicator.setAttribute('aria-pressed', active ? 'true' : 'false');
                });
            };

            let scrollFrame = null;
            carousel.addEventListener('scroll', () => {
                if (scrollFrame) cancelAnimationFrame(scrollFrame);
                scrollFrame = requestAnimationFrame(updateIndicator);
            }, { passive: true });

            indicators.forEach((indicator, index) => {
                indicator.addEventListener('click', () => {
                    items[index].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'start' });
                });
            });

            updateIndicator();
        }

        // 載入最新資訊資料
        async function loadNewsData() {
            try {
                const response = await fetch('/api/homepage?type=news');
                if (response.ok) {
                    newsData = await response.json();
                    // 只取最新的6個
                    newsData = newsData.slice(0, 6);
                    renderNewsCarousel();
                } else {
                    console.error('載入最新資訊失敗');
                    document.getElementById('newsCarousel').innerHTML = '<div class="carousel-loading">載入失敗</div>';
                }
            } catch (error) {
                console.error('載入最新資訊錯誤:', error);
                document.getElementById('newsCarousel').innerHTML = '<div class="carousel-loading">載入失敗</div>';
            }
        }

        // 渲染輪播內容
        function renderNewsCarousel() {
            const carousel = document.getElementById('newsCarousel');
            const indicators = document.getElementById('carouselIndicators');
            
            if (newsData.length === 0) {
                carousel.innerHTML = '<div class="carousel-loading">暫無最新資訊</div>';
                return;
            }

            // 渲染輪播內容
            carousel.innerHTML = newsData.map((item, index) => `
                <div class="news-slide ${index === 0 ? 'active' : ''}">
                    <a href="${item.link || '#'}" target="_blank" rel="noopener noreferrer" aria-label="${item.title}（另開新分頁）">
                        <img src="${item.imageUrl}" alt="${item.title}" />
                        <div class="news-content">
                            <h3>${item.title}</h3>
                            <p>${item.description}</p>
                        </div>
                    </a>
                </div>
            `).join('');

            initializeSwipeCarousel(carousel, '.news-slide', indicators);
        }

        // 載入一般資訊資料
        async function loadCommonData() {
            try {
                const response = await fetch('/api/homepage?type=common');
                if (response.ok) {
                    commonData = await response.json();
                    // 只取最新的6個
                    commonData = commonData.slice(0, 6);
                    renderInfoCarousel();
                } else {
                    console.error('載入一般資訊失敗');
                    document.getElementById('infoCarousel').innerHTML = '<div class="carousel-loading">載入失敗</div>';
                }
            } catch (error) {
                console.error('載入一般資訊錯誤:', error);
                document.getElementById('infoCarousel').innerHTML = '<div class="carousel-loading">載入失敗</div>';
            }
        }

        // 渲染一般資訊輪播內容
        function renderInfoCarousel() {
            const carousel = document.getElementById('infoCarousel');
            const indicators = document.getElementById('infoIndicators');
            
            if (commonData.length === 0) {
                carousel.innerHTML = '<div class="carousel-loading">暫無一般資訊</div>';
                return;
            }

            // 渲染輪播內容
            carousel.innerHTML = commonData.map((item, index) => `
                <a href="${item.link || '#'}" class="info-card" target="_blank" rel="noopener noreferrer" aria-label="${item.title || '一般資訊'}（另開新分頁）">
                    <img src="${item.imageUrl}" alt="${item.title || ''}" class="info-image">
                    <h3 class="info-title">${item.title || ''}</h3>
                    <p class="info-desc">${item.description || ''}</p>
                </a>
            `).join('');
            
            initializeSwipeCarousel(carousel, '.info-card', indicators);
        }

        document.addEventListener('DOMContentLoaded', function () {
            updateNavigation();
            
            // 載入最新資訊
            loadNewsData();
            
            // 載入一般資訊
            loadCommonData();
        });
    </script>
    

</body>
</html>
